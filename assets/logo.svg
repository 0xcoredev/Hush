<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e27"/>
      <stop offset="1" stop-color="#1a1b3a"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e8f0"/>
      <stop offset="1" stop-color="#b8b8d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background (for use on any surface) -->
  <!-- Icon mark: crescent moon + whisper dots -->
  <g transform="translate(40, 56)">
    <g filter="url(#glow)">
      <path d="M 88 64
               A 44 44 0 1 1 44 20
               A 34 34 0 1 0 88 64 Z"
            fill="url(#moon)"/>
    </g>
    <g fill="#9b59b6" opacity="0.85">
      <circle cx="110" cy="48" r="2.5"/>
      <circle cx="120" cy="40" r="2"/>
      <circle cx="128" cy="32" r="1.5"/>
      <circle cx="114" cy="58" r="1.5"/>
    </g>
    <g fill="#e8e8f0" opacity="0.5">
      <circle cx="20" cy="20" r="1.2"/>
      <circle cx="32" cy="12" r="0.8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="180" y="108"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="56" font-weight="700" fill="#e8e8f0" letter-spacing="2">
    Hush
  </text>

  <!-- Tagline -->
  <text x="182" y="140"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="15" font-weight="400" fill="#9b59b6" letter-spacing="3" opacity="0.9">
    SPEAK FREELY · STAY VEILED
  </text>

  <!-- Sub-tagline -->
  <text x="182" y="162"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="12" font-weight="400" fill="#8888a8" letter-spacing="1">
    Anonymous confessions on Midnight
  </text>
</svg>
